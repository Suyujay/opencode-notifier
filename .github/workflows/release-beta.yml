name: release

# Publishes to npm via OIDC trusted publishing (no tokens or secrets). Runs
# ONLY on version tags, never on branch pushes or PRs. The dist-tag is routed
# by tag shape, so beta and stable can never cross:
#   v0.3.0-beta.0 -> `beta`    (npm version 0.3.0-beta.0 && git push --tags)
#   v0.3.0        -> `latest`  (npm version 0.3.0 && git push --tags)
# One-time setup on npmjs.com (package Settings -> Trusted Publisher ->
# GitHub Actions, repo mohak34/opencode-notifier, workflow release-beta.yml,
# allow `npm publish`). The filename is historic; it now handles both tracks.

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # required for npm OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build

      # setup-node writes the .npmrc that lets `npm publish` exchange the
      # OIDC token. Publish itself must use the npm CLI (>= 11.5.1).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest

      - name: Publish to npm (beta or stable by tag shape)
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta* ]]; then
            TAG=beta
          else
            TAG=latest
          fi
          echo "Publishing ${GITHUB_REF_NAME} with dist-tag ${TAG}"
          npm publish --tag "${TAG}" --provenance
